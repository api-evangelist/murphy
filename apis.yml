aid: murphy
name: Murphy
description: >-
  Murphy is a Barcelona-based fintech building AI voice and omnichannel agents
  that automate debt collection and servicing for banks, fintechs, utilities,
  telecoms and debt collection agencies. Founded in 2024 by Borja Sole and Marc
  Sanchez, the platform runs 24/7 AI agents across voice, SMS and email in 15+
  languages, handling inbound and outbound recovery with human escalation,
  behavioural personalisation and fully audited, compliance-bounded interactions
  (ISO 27001, GDPR and EU AI Act aligned). Murphy claims materially higher
  recovery rates and 50-70% lower operational cost. It raised roughly $15M
  (seed + pre-seed) led by Northzone with ElevenLabs, Lakestar, Seedcamp and
  Enzo Ventures. Added to the API Evangelist network as a company profile; no
  public developer API, SDK or documentation surface is currently published.
